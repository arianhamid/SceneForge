[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sceneforge"
version = "0.1.0"
description = "The Open Framework for Narrative Intelligence"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Arian Hamid" }
]
keywords = [
    "video-understanding",
    "narrative-intelligence",
    "knowledge-graph",
    "movie-analysis",
    "ai-framework",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/arianhamid/SceneForge"
Repository = "https://github.com/arianhamid/SceneForge"
Issues = "https://github.com/arianhamid/SceneForge/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
scenedetect = [
    "scenedetect>=0.7",
]
whisper = [
    "faster-whisper>=1.0",
]
opencv = [
    "opencv-python-headless>=4.8",
]
tesseract = [
    "pytesseract>=0.3",
    "Pillow>=10.0",
]
transformers_caption = [
    "transformers>=4.40",
    "torch>=2.0",
]
transformers_object_detection = [
    "transformers>=4.40",
    "torch>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["core", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# scenedetect ships no py.typed marker / stubs. faster_whisper isn't
# imported directly by sceneforge (WhisperModelProtocol is structural,
# see sceneforge/contrib/whisper/provider.py), so it needs no override.
module = "scenedetect.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# cv2's bundled stubs don't cover the cv2.data submodule attribute
# (cv2.data.haarcascades) used by sceneforge/contrib/opencv.
module = "cv2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pytesseract ships no py.typed marker / stubs.
module = "pytesseract.*"
ignore_missing_imports = true
